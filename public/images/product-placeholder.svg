<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003F86" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.8" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Center Glass Card -->
  <rect x="250" y="160" width="300" height="280" rx="32" fill="#ffffff" fill-opacity="0.85" stroke="#cbd5e1" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.06))" />

  <!-- Inner Blueprint Gear Icon -->
  <g transform="translate(400, 270)">
    <circle r="56" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
    <circle r="44" fill="url(#primaryGrad)" fill-opacity="0.1" stroke="#003F86" stroke-width="3" />
    <!-- Gear icon paths -->
    <path d="M-12 -38 L12 -38 L16 -26 L26 -22 L38 -30 L48 -14 L36 -4 L38 8 L48 14 L38 30 L26 22 L16 26 L12 38 L-12 38 L-16 26 L-26 22 L-38 30 L-48 14 L-36 4 L-38 -8 L-48 -14 L-38 -30 L-26 -22 L-16 -26 Z" fill="url(#primaryGrad)" />
    <circle r="18" fill="#ffffff" stroke="#003F86" stroke-width="3" />
    <circle r="8" fill="url(#amberGrad)" />
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0f172a">
    طیوران صنعت پویا
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#64748b">
    تصویر محصول به‌زودی اضافه می‌شود
  </text>

  <!-- Top Badge -->
  <rect x="330" y="180" width="140" height="24" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="400" y="196" text-anchor="middle" font-family="monospace" font-weight="700" font-size="11" fill="#003F86">
    TOYOORAN INDUSTRIAL
  </text>
</svg>
